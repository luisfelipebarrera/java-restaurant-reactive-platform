services:
  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    ports:
      - "${MESSAGE_PORT}:5672"
      - "${ADMIN_PORT}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - ${RABBITMQ_DATA_PATH}:/var/opt/rabbitmq/data
      - ${RABBITMQ_LOG_PATH}:/var/opt/rabbitmq/log
 
